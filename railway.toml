# Railway Configuration for GYDI 2.0 Backend
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
# Use Dockerfile for building
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# Watch only backend changes
watchPatterns = ["GydiMicroservices/**"]

[deploy]
# Start command (defined in Dockerfile ENTRYPOINT, but can override here)
# startCommand = "java -jar app.jar"

# Health check configuration
healthcheckPath = "/actuator/health"
healthcheckTimeout = 100

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Number of replicas (1 for free tier)
numReplicas = 1

# Region (choose closest to your users)
# Options: us-west1, us-east4, europe-west4, asia-southeast1
# region = "us-west1"

[deploy.healthcheck]
# Health check endpoint
path = "/actuator/health"
# Timeout in seconds
timeout = 10
# Interval between checks in seconds
interval = 30
