spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS users\;CREATE SCHEMA IF NOT EXISTS properties\;CREATE SCHEMA IF NOT EXISTS audit\;CREATE SCHEMA IF NOT EXISTS referrals\;CREATE SCHEMA IF NOT EXISTS payment\;CREATE SCHEMA IF NOT EXISTS subscriptions
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_enum_jdbc_type: VARCHAR
          # Map JSON type to VARCHAR for H2 compatibility
          preferred_jsonb_jdbc_type: VARCHAR

  flyway:
    enabled: false
  mail:
    username: test@test.com
    password: test-password

# Stripe configuration for tests
stripe:
  api-key: sk_test_fake_key_for_unit_tests
  publishable-key: pk_test_fake_key_for_unit_tests
  webhook-secret: whsec_fake_secret_for_unit_tests
  currency: USD

aws:
  ses:
    region: us-east-1
    from-email: test@test.com
    access-key: test-key
    secret-key: test-secret

app:
  password-reset:
    token-expiration-minutes: 60
    frontend-url: http://localhost:3000

security:
  url:
    hashids:
      salt: test-salt-for-hashids
      min-length: 10
    aes:
      secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jwt:
  secret: test-jwt-secret-key-for-tests-should-be-long-enough-to-be-secure
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days
  referral:
    secret: test-jwt-referral-secret-key-for-tests-should-be-long-enough
    expiration-ms: 2592000000 # 30 days
