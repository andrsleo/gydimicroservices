# ============================================
# LOCAL DEVELOPMENT PROFILE
# ============================================
# For use on developer machines (localhost)
#
# Required environment variables (.env.local file recommended):
# - DB_PASSWORD           # Local PostgreSQL password
# - JWT_SECRET            # Dev JWT secret (insecure OK for local)
# - JWT_REFERRAL_SECRET   # Dev referral JWT secret
# - AES_SECRET_KEY        # Dev AES key (64 hex chars)
# - URL_HASHIDS_SALT      # Dev Hashids salt
#
# Optional:
# - CLOUDINARY_URL        # If testing file uploads
# - RESEND_API_KEY        # If testing email sending
# - STRIPE_API_KEY        # Stripe test key
# ============================================

spring:
  # ============================================
  # Database Configuration (Local PostgreSQL or Supabase Dev)
  # ============================================
  datasource:
    # Option 1: Local PostgreSQL
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gydidb}

    # Option 2: Supabase Dev instance (shared with dev environment)
    # url: jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require

    username: ${DB_USERNAME:andresvargas}
    password: ${DB_PASSWORD:Gydi2025@}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================
  # JPA/Hibernate Configuration
  # ============================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false # Disabled to reduce console noise
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_jsonb_jdbc_type: 1111
    hibernate:
      ddl-auto: none # Use Flyway for schema management
    open-in-view: false

  # ============================================
  # Flyway Configuration
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: users,properties,audit,referrals,payment,subscriptions
    validate-on-migrate: false
    out-of-order: true
    clean-disabled: false # Allow clean in local (NEVER in production!)

  # ============================================
  # Email Configuration (Gmail SMTP for Dev testing)
  # ============================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:gydiproperties@gmail.com}
    password: ${GMAIL_APP_PASSWORD:iuwuuvtbjhqvclrs}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    test-connection: false

  # ============================================
  # Cache Configuration (Local - Disabled for development)
  # ============================================
  cache:
    type: none # Disable caching in local for immediate feedback during development

# ============================================
# Server Configuration
# ============================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# ============================================
# JWT Configuration (Development secrets - NOT for production!)
# ============================================
jwt:
  secret: ${JWT_SECRET:z8rypMgxSqo/TLU1wGDVfV776CyXvy1jZm0veVZOy85CPc/0cA/ONKnKq6sfD0mn9AHHc/qHTrKjoRL8EEMs1Q==}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  referral:
    secret: ${JWT_REFERRAL_SECRET:0xXaYClhIkthoFZwGjtmArdVQLqZ5Px0C3Y1qduA9OuMIhPJ5iwIw92Ocn0AEyOs1wOpthIWhSXK5H9Rr9kMdA==}
    expiration-ms: ${JWT_REFERRAL_EXPIRATION:31536000000} # 365 days

# ============================================
# Security Configuration
# ============================================
security:
  url:
    hashids:
      salt: ${URL_HASHIDS_SALT:D+TA0eXEuTqB86E648HZXwfGeobglfjWQfHStts6iQ4=}
      min-length: 10
    aes:
      # Must be exactly 64 hex characters (32 bytes = 256 bits)
      secret: ${AES_SECRET_KEY:ce540225cc2c4d6ec267e39edeb3a666880d8f9104e70f8f2621d4d6a91f64f6}

# ============================================
# Stripe Payment Configuration (Test Keys)
# ============================================
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_51SdIGWQuBbKiBgeuKX1hhwE6kVA5QO01wntUIUg8HATDt08jtZmYWS5YOcMvoukEwgwcpBe6lOIeqEgvSMVGNUsn00upygkUds}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_51SdIGWQuBbKiBgeuyICFekmubnq6NtogWfozScafwnub3BT3Nf3j9s8qccOEomqk4MrA9bTdA86pif2BH550dLwT00CLzMTdqG}

# ============================================
# Logging Configuration (Verbose for debugging)
# ============================================
logging:
  level:
    root: INFO
    com.affiliate.rentals.gydi: INFO
    org.springframework.security: WARN # Reduced from DEBUG
    org.springframework.web: WARN # Reduced from DEBUG
    org.hibernate.SQL: WARN # Disabled SQL logging
    org.hibernate.type.descriptor.sql.BasicBinder: WARN # Disabled parameter logging
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ============================================
# Actuator Configuration (All endpoints exposed in local)
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: "*" # All endpoints exposed for debugging
      base-path: /actuator
  endpoint:
    health:
      show-details: always # Always show full health details
    env:
      show-values: always # Show all environment variables
  # Enable metrics export
  metrics:
    export:
      prometheus:
        enabled: true

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true # Swagger UI enabled in local
    operations-sorter: method
    tags-sorter: alpha

# ============================================
# Encryption Configuration (Local Development)
# ============================================
# SECURITY FIX (FIX-007): PII Encryption at Rest
# IMPORTANT: This is a TEST KEY for local development only
# For production, use: fly secrets set PII_ENCRYPTION_KEY="$(openssl rand -hex 32)"
encryption:
  pii:
    # Test key (32 bytes = 64 hex chars)
    secret: ${PII_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# ============================================
# Feature Flags (Local Development - All enabled for testing)
# ============================================
features:
  ml-recommendations: ${FEATURE_ML_RECOMMENDATIONS:true}
  referral-analytics: ${FEATURE_REFERRAL_ANALYTICS:true}
  new-payment-flow: ${FEATURE_NEW_PAYMENT:true}
  ab-testing: ${FEATURE_AB_TESTING:true}
  multi-region: ${FEATURE_MULTI_REGION:false}
