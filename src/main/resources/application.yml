# ============================================
# Application Configuration
# ============================================
spring:
  application:
    name: gydi-rentals

  # ============================================
  # PostgreSQL Database Configuration
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/gydidb
    username: andresvargas
    password:
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_jsonb_jdbc_type: 1111
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # ============================================
  # Flyway Configuration
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: users,properties,bookings,audit
    validate-on-migrate: true

  # ============================================
  # MongoDB Configuration (for future use)
  # ============================================
  data:
    mongodb:
      uri: mongodb://localhost:27017/gydi_rentals

# ============================================
# Server Configuration
# ============================================
server:
  port: 8080
  servlet:
    context-path: /

# ============================================
# JWT Configuration
# ============================================
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.affiliate.rentals.gydi: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# ============================================
# Actuator Configuration
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
