server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gydidb
    username: andresvargas
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none   # No modificar la estructura automáticamente
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

flyway:
  enabled: true
  baseline-on-migrate: true
  locations: classpath:db/migration
