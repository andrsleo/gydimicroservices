# ============================================
# Application Configuration
# ============================================
spring:
  application:
    name: gydi-rentals

  # Set default profile to 'dev' for development
  profiles:
    active: dev

  # Disable MongoDB autoconfiguration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  # ============================================
  # PostgreSQL Database Configuration
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/gydidb
    username: andresvargas
    password: Gydi2025@
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_jsonb_jdbc_type: 1111
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # ============================================
  # Flyway Configuration
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: users,properties,audit,referrals,payment
    validate-on-migrate: false
    out-of-order: true

  # ============================================
  # MongoDB Configuration (for future use)
  # ============================================
  data:
    mongodb:
      uri: mongodb://localhost:27017/gydi_rentals

  # ============================================
  # Spring Mail Configuration (Gmail SMTP for Development)
  # ============================================
  # Mail configuration is profile-specific (see application-dev.yml, application-prod.yml)

  # ============================================
  # File Upload Configuration
  # ============================================
  # SECURITY: Limits prevent DoS attacks via large file uploads
  # These are Spring Boot limits (first layer of defense)
  # FileValidator provides additional validation (second layer)
  servlet:
    multipart:
      enabled: true
      # Max single file: 100MB (for videos, images are limited to 10MB by FileValidator)
      max-file-size: 100MB
      # Max total request: 150MB (allows multiple files + metadata)
      max-request-size: 150MB
      # File size threshold for writing to disk (default: 0 = always disk)
      file-size-threshold: 0

# ============================================
# Server Configuration
# ============================================
server:
  port: 8080
  servlet:
    context-path: /

# ============================================
# JWT Configuration
# ============================================
# SECURITY: JWT secret MUST be set via environment variable
# Generate strong secret: openssl rand -base64 64
# DO NOT commit actual secrets to git
jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_ENVIRONMENT_VARIABLE}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  # JWT for referral tokens
  referral:
    secret: ${JWT_REFERRAL_SECRET:CHANGE_ME_JWT_REFERRAL_SECRET_KEY_256_BITS_MINIMUM_32_CHARS}
    expiration-ms: ${JWT_REFERRAL_EXPIRATION:2592000000} # 30 days in milliseconds

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.affiliate.rentals.gydi: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# ============================================
# Actuator Configuration
# ============================================
# SECURITY: Most endpoints are restricted to ADMIN role (see SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        # Only expose these endpoints (others are disabled)
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      # Show full details only when user is authenticated
      show-details: when-authorized
      # Cache health responses for 10 seconds to prevent abuse
      cache:
        time-to-live: 10s
    info:
      # Using 'access' instead of deprecated 'enabled'
      access: unrestricted
    metrics:
      # Using 'access' instead of deprecated 'enabled'
      access: unrestricted
    # Disable dangerous endpoints using 'access: none'
    shutdown:
      access: none  # Disabled - can shutdown the application
    env:
      # Environment endpoint requires ADMIN role (configured in SecurityConfig)
      access: unrestricted
      show-values: when-authorized  # Hide values from unauthorized users
    threaddump:
      access: none  # Disabled - can reveal sensitive data
    heapdump:
      access: none  # Disabled - contains all application memory
    logfile:
      access: none  # Disabled - can contain sensitive logs

# ============================================
# AWS Configuration
# ============================================
aws:
  # Amazon SES for Email
  ses:
    region: ${AWS_REGION:us-east-1}
    from-email: ${AWS_SES_FROM_EMAIL:noreply@gydi.com}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

  # Amazon S3 for File Storage (Production only)
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:gydi-profile-images}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    base-url: ${AWS_S3_BASE_URL:https://gydi-profile-images.s3.amazonaws.com}

# ============================================
# Storage Configuration (Development)
# ============================================
storage:
  local:
    directory: ./uploads
    base-url: http://localhost:8080/uploads

# ============================================
# Password Reset Configuration
# ============================================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    token-expiration-minutes: 60
    rate-limit-requests: 3
    rate-limit-window-hours: 1
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  dev-email-recipient: alvargasrod@gmail.com

# ============================================
# URL Encryption & Security Configuration
# ============================================
security:
  url:
    # Hashids configuration for property ID obfuscation
    hashids:
      salt: ${URL_HASHIDS_SALT:gydi-2024-property-secure-salt-change-in-production}
      min-length: 10  # Minimum length of encoded property IDs
    # AES-256 configuration for user ID encryption
    aes:
      # IMPORTANT: Must be exactly 32 characters (256 bits)
      # Generate with: openssl rand -base64 32 | head -c 32
      secret: ${URL_AES_SECRET:CHANGE_ME_32_CHAR_SECRET_KEY!!!}
