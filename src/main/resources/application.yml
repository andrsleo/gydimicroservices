# ============================================
# Application Configuration
# ============================================
spring:
  application:
    name: gydi-rentals

  # Set default profile to 'dev' for development
  profiles:
    active: dev

  # Disable MongoDB autoconfiguration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

  # ============================================
  # PostgreSQL Database Configuration
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/gydidb
    username: andresvargas
    password:
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_jsonb_jdbc_type: 1111
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # ============================================
  # Flyway Configuration
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: users,properties,bookings,audit
    validate-on-migrate: true

  # ============================================
  # MongoDB Configuration (for future use)
  # ============================================
  data:
    mongodb:
      uri: mongodb://localhost:27017/gydi_rentals

  # ============================================
  # Spring Mail Configuration (Gmail SMTP for Development)
  # ============================================
  # Mail configuration is profile-specific (see application-dev.yml, application-prod.yml)

  # ============================================
  # File Upload Configuration
  # ============================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 550MB

# ============================================
# Server Configuration
# ============================================
server:
  port: 8080
  servlet:
    context-path: /

# ============================================
# JWT Configuration
# ============================================
jwt:
  secret: ***REMOVED***
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# ============================================
# Logging Configuration
# ============================================
logging:
  level:
    root: INFO
    com.affiliate.rentals.gydi: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# ============================================
# Actuator Configuration
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============================================
# AWS Configuration
# ============================================
aws:
  # Amazon SES for Email
  ses:
    region: ${AWS_REGION:us-east-1}
    from-email: ${AWS_SES_FROM_EMAIL:noreply@gydi.com}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

  # Amazon S3 for File Storage (Production only)
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:gydi-profile-images}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    base-url: ${AWS_S3_BASE_URL:https://gydi-profile-images.s3.amazonaws.com}

# ============================================
# Storage Configuration (Development)
# ============================================
storage:
  local:
    directory: ./uploads
    base-url: http://localhost:8080/uploads

# ============================================
# Password Reset Configuration
# ============================================
app:
  password-reset:
    token-expiration-minutes: 60
    rate-limit-requests: 3
    rate-limit-window-hours: 1
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  dev-email-recipient: alvargasrod@gmail.com
