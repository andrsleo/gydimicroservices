# ============================================
# PRODUCTION PROFILE
# ============================================
# Variables de entorno requeridas:
# - DB_USERNAME
# - DB_PASSWORD
# - AWS_REGION
# - AWS_SES_FROM_EMAIL
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - JWT_SECRET
# - FRONTEND_URL
# ============================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

aws:
  ses:
    region: ${AWS_REGION}
    from-email: ${AWS_SES_FROM_EMAIL}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

app:
  password-reset:
    frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: WARN
    com.affiliate.rentals.gydi: INFO
