# ============================================
# PRODUCTION PROFILE (Fly.io Deployment)
# ============================================
# Required environment variables (set via: fly secrets set KEY=VALUE):
#
# Database:
# - DATABASE_URL          # Auto-set by Fly Postgres attach
# - DB_USERNAME           # Database username
# - DB_PASSWORD           # Database password (strong, random)
#
# Security/Encryption:
# - JWT_SECRET            # Generate: openssl rand -base64 64
# - JWT_REFERRAL_SECRET   # Generate: openssl rand -base64 64
# - AES_SECRET_KEY        # Generate: openssl rand -hex 32
# - URL_HASHIDS_SALT      # Generate: openssl rand -base64 32
#
# Cloud Services:
# - CLOUDINARY_URL        # Format: cloudinary://key:secret@cloud_name
# - RESEND_API_KEY        # From resend.com dashboard
# - RESEND_FROM_EMAIL     # Verified email (e.g., noreply@gydi.com)
#
# Application:
# - FRONTEND_URL          # e.g., https://gydi.vercel.app
# - SENTRY_DSN            # Optional: for error tracking
#
# SECURITY: Never commit secrets to git. Use Fly Secrets for all sensitive data.
# ============================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000  # 1 hour (reduced from 24h for production security)
  refresh-expiration: 604800000  # 7 days
  referral:
    secret: ${JWT_REFERRAL_SECRET}
    expiration-ms: 2592000000  # 30 days

# ============================================
# Cloud Services (Production)
# ============================================
# Cloudinary for file storage (replaces AWS S3)
cloudinary:
  url: ${CLOUDINARY_URL}

# Resend for email service (replaces AWS SES)
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

# Storage provider
storage:
  provider: cloudinary  # Use Cloudinary in production

# Email provider
email:
  provider: resend  # Use Resend in production

# ============================================
# Security Configuration
# ============================================
security:
  url:
    hashids:
      salt: ${URL_HASHIDS_SALT}
      min-length: 10
    aes:
      secret: ${AES_SECRET_KEY}

# ============================================
# Application Configuration
# ============================================
app:
  frontend-url: ${FRONTEND_URL}
  password-reset:
    frontend-url: ${FRONTEND_URL}
    token-expiration-minutes: 60
    rate-limit-requests: 3
    rate-limit-window-hours: 1

# ============================================
# Monitoring (Optional)
# ============================================
sentry:
  dsn: ${SENTRY_DSN:}  # Optional: error tracking
  environment: production
  traces-sample-rate: 0.1  # Sample 10% of transactions

# ============================================
# Actuator Configuration (PRODUCTION)
# ============================================
# SECURITY: Minimum endpoints exposed in production
management:
  endpoints:
    web:
      exposure:
        # Only health and info in production
        include: health,info
  endpoint:
    health:
      # Never show details publicly in production
      show-details: never
    info:
      # Use new syntax instead of enabled (deprecated)
      access: unrestricted
    # Disable all dangerous endpoints in production
    shutdown:
      access: none
    env:
      access: none
    metrics:
      access: none
    threaddump:
      access: none
    heapdump:
      access: none
    logfile:
      access: none

# ============================================
# Error Handling (PRODUCTION)
# ============================================
server:
  error:
    # Never expose sensitive information in error responses
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

# ============================================
# Swagger/OpenAPI (PRODUCTION)
# ============================================
springdoc:
  # Disable Swagger UI in production for security
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.affiliate.rentals.gydi: INFO
