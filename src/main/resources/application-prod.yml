# ============================================
# PRODUCTION PROFILE
# ============================================
# Variables de entorno requeridas:
# - DB_USERNAME
# - DB_PASSWORD
# - AWS_REGION
# - AWS_S3_BUCKET_NAME
# - AWS_S3_BASE_URL
# - AWS_SES_FROM_EMAIL
# - JWT_SECRET
# - FRONTEND_URL
#
# SECURITY: AWS credentials are obtained via IAM roles (recommended)
# or environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# ============================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

aws:
  # SECURITY: Credentials obtained via DefaultCredentialsProvider
  # (IAM roles or environment variables)
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}
    base-url: ${AWS_S3_BASE_URL}

  ses:
    region: ${AWS_REGION}
    from-email: ${AWS_SES_FROM_EMAIL}

app:
  password-reset:
    frontend-url: ${FRONTEND_URL}

# ============================================
# Actuator Configuration (PRODUCTION)
# ============================================
# SECURITY: Minimum endpoints exposed in production
management:
  endpoints:
    web:
      exposure:
        # Only health and info in production
        include: health,info
  endpoint:
    health:
      # Never show details publicly in production
      show-details: never
    info:
      # Use new syntax instead of enabled (deprecated)
      access: unrestricted
    # Disable all dangerous endpoints in production
    shutdown:
      access: none
    env:
      access: none
    metrics:
      access: none
    threaddump:
      access: none
    heapdump:
      access: none
    logfile:
      access: none

# ============================================
# Error Handling (PRODUCTION)
# ============================================
server:
  error:
    # Never expose sensitive information in error responses
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

# ============================================
# Swagger/OpenAPI (PRODUCTION)
# ============================================
springdoc:
  # Disable Swagger UI in production for security
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.affiliate.rentals.gydi: INFO
